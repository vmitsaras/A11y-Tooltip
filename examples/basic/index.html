<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A11y Tooltip — Basic example</title>
  <link rel="stylesheet" href="../../dist/styles.css">
  <style>
    body {
      margin: 0;
      padding: 4rem 1.5rem;
      font-family: system-ui, sans-serif;
      color: #15181d;
      background: #f7f8fa;
    }

    main {
      max-width: 48rem;
      margin-inline: auto;
    }

    .example-row {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: center;
      margin-block: 3rem;
    }

    button {
      min-block-size: 2.75rem;
      padding-inline: 1rem;
      border: 1px solid #8c95a3;
      border-radius: 0.5rem;
      background: white;
      color: inherit;
      font: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>A11y Tooltip</h1>
    <p>Hover or focus a trigger. Press <kbd>Escape</kbd> to dismiss the tooltip.</p>

    <div class="example-row">
      <span
        class="a11y-tooltip"
        data-a11y-tooltip
        data-a11y-tooltip-placement="top"
      >
        <button class="a11y-tooltip__trigger" data-a11y-tooltip-trigger>
          Shipping
        </button>
        <span
          class="a11y-tooltip__content"
          data-a11y-tooltip-content
        >
          Free standard shipping on orders over €50.
        </span>
      </span>

      <span
        class="a11y-tooltip"
        data-a11y-tooltip
        data-a11y-tooltip-placement="bottom"
      >
        <button
          class="a11y-tooltip__trigger"
          data-a11y-tooltip-trigger
          aria-label="More information about refunds"
        >
          Refunds
        </button>
        <span
          class="a11y-tooltip__content"
          data-a11y-tooltip-content
        >
          Refunds are returned to the original payment method.
        </span>
      </span>
    </div>
  </main>

  <script type="module">
    import { initTooltipsAll } from "../../dist/index.js";
    initTooltipsAll();
  </script>
</body>
</html>
